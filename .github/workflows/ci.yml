name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Check Python syntax
        run: python -m py_compile backend/algorithm.py backend/main.py backend/models.py backend/store.py backend/redis_client.py

      - name: Check JavaScript syntax
        run: |
          node --check frontend/js/index.js
          node --check frontend/js/room.js
          node --check frontend/js/grid.js
          node --check frontend/js/ws.js

      - name: Check whitespace
        run: git diff-tree --check --no-commit-id --root -r HEAD
